location = /adpilot {
    return 308 /adpilot/;
}

location ^~ /adpilot/api/ {
    proxy_pass http://127.0.0.1:4015/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;
    client_max_body_size 55m;
    proxy_buffering off;
    # Keep the application's validation and provider errors intact. This fallback
    # only handles Nginx connection failures while the API is restarting.
    proxy_intercept_errors off;
    error_page 502 504 = @adpilot_api_unavailable;
}

location ^~ /adpilot/ {
    alias /srv/adpilot/current/public/;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self' https: data:;connect-src 'self';font-src 'self';object-src 'none';frame-ancestors 'none'" always;
}

location @adpilot_api_unavailable {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service is temporarily unavailable. Your saved data remains safe. Please retry shortly."}}';
}
